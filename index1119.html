<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>電腦硬體裝修丙級｜監評指定內容表練習平台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#1d2b2a;--mut:#5d6f6d;--line:#d9e3e1;--acc:#0f7d74;--acc2:#e6f4f2;--ok:#1a7f37;--okbg:#e8f6ec;--bad:#c62828;--badbg:#fdecec;--warn:#9a6700;--warnbg:#fff6dd;--mono:'JetBrains Mono',Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:#0f3d3a;color:#fff}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:220px}
.top h1 small{display:block;font-weight:400;opacity:.75;font-size:12.5px}
.station{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:10px}
.station b{font-family:var(--mono);font-size:20px;letter-spacing:1px;background:#fff;color:#0f3d3a;padding:0 8px;border-radius:6px}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:5px 11px;font-size:13.5px}
.tbtn:hover{background:rgba(255,255,255,.25)}
.wrap{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 62px)}
.side{border-right:1px solid var(--line);background:#fff;padding:12px 10px;overflow:auto}
.prog{margin:2px 6px 12px;font-size:13px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.nav{list-style:none;margin:0;padding:0}
.nav li button{width:100%;display:flex;align-items:center;gap:9px;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;color:var(--ink)}
.nav li button:hover{background:var(--acc2)}
.nav li button.on{background:var(--acc);color:#fff}
.nav .n{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--ink)}
.nav .on .n{background:#fff;color:var(--acc)}
.nav .done .n{background:var(--ok);color:#fff}
.nav .t{flex:1;font-size:14px}
.nav .os{font-size:10.5px;opacity:.7}
.main{padding:22px 28px 60px;max-width:1040px;width:100%}
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.head .big{width:42px;height:42px;border-radius:12px;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.head h2{margin:0;font-size:22px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--acc2);color:var(--acc);margin-left:4px;font-weight:500;vertical-align:middle}
.tag.lx{background:#fff1e0;color:#b45309}
.passed{margin-left:auto;font-size:13px;color:var(--ok);font-weight:700}
.req{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:16px}
.lbl{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.5px;margin-bottom:2px}
.req p{margin:0 0 10px}
.specv{font-size:16px;font-weight:700;color:#0f3d3a;background:#e9f6f3;border-left:4px solid var(--acc);padding:7px 12px;border-radius:6px}
.specv code{font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:-1px}
.tabs button{border:1px solid var(--line);border-bottom:0;background:#eef2f1;padding:8px 18px;border-radius:10px 10px 0 0;color:var(--mut);font-weight:500}
.tabs button.on{background:#fff;color:var(--acc);font-weight:700}
.panel{background:#fff;border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:18px 20px}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 12px 38px}
ol.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--acc2);color:var(--acc);font-weight:700;font-size:13px;display:grid;place-items:center}
.sub{font-size:13.5px;font-weight:700;color:var(--acc);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.sub:first-child{margin-top:0}
code,.k{font-family:var(--mono);font-size:13.5px;background:#eef3f2;padding:1px 5px;border-radius:4px;word-break:break-all}
.k{background:#fff;border:1px solid #c9d4d2;border-bottom-width:2px;font-family:inherit;font-size:12.5px}
pre.cmd{background:#122;color:#d7f5ee;font-family:var(--mono);font-size:13px;padding:10px 12px;border-radius:8px;overflow:auto;margin:6px 0;white-space:pre-wrap}
.tip{background:var(--warnbg);border:1px solid #f0d78c;border-radius:10px;padding:10px 14px;margin-top:10px;font-size:14px}
.tip b{color:var(--warn)}
.tip ul{margin:4px 0 0;padding-left:20px}
.note{font-size:13px;color:var(--mut)}
.simintro{font-size:14px;color:var(--mut);margin:0 0 12px}
.win{border:1px solid #9aa;border-radius:6px;background:#f0f0f0;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-bottom:14px;overflow:visible;font-family:'Segoe UI','Noto Sans TC',sans-serif;font-size:14px}
.win .tt{background:#fff;padding:6px 10px;font-size:13px;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:8px;border-radius:6px 6px 0 0}
.win .tt::after{content:'✕';margin-left:auto;color:#666}
.win .bd{padding:12px 14px}
.gn{border:1px solid #ccc;border-radius:12px;background:#fafafa;margin-bottom:14px;overflow:hidden;font-family:Ubuntu,'Noto Sans TC',sans-serif;font-size:14px}
.gn .tt{background:#ebebeb;padding:7px 12px;font-weight:700;font-size:13px;text-align:center}
.gn .bd{padding:12px 14px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.row label.w{width:150px;flex:none}
.row input[type=text],.row input[type=number],.row select{padding:4px 7px;border:1px solid #aab;border-radius:4px;background:#fff;min-width:0}
.mono{font-family:var(--mono)}
.btn{background:#e1e1e1;border:1px solid #adadad;padding:3px 14px;border-radius:3px;font-size:13.5px}
.btn:hover{background:#e5f1fb;border-color:#0078d7}
.btn.pri{background:#0078d7;color:#fff;border-color:#0067b8}
table.dk{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
table.dk th,table.dk td{border-bottom:1px solid #e3e3e3;padding:5px 8px;text-align:left}
table.dk th{background:#f7f7f7;font-weight:500}
table.dk tr.sel td{background:#cce8ff}
table.dk tbody tr{cursor:pointer}
.checkbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.cbtn{border:0;border-radius:8px;padding:8px 18px;font-weight:700}
.cbtn.go{background:var(--acc);color:#fff}
.cbtn.go:hover{background:#0b6159}
.cbtn.ghost{background:#eef2f1;color:var(--ink)}
.result{margin-top:12px;border-radius:10px;padding:10px 14px;font-size:14px;display:none}
.result.ok{display:block;background:var(--okbg);border:1px solid #9fd5ae}
.result.bad{display:block;background:var(--badbg);border:1px solid #f1b1b1}
.result ul{margin:4px 0 0;padding-left:20px;list-style:none}
.result li.y{color:var(--ok)}.result li.n{color:var(--bad)}.result li.w{color:var(--warn)}
.ans{display:none;margin-top:10px;background:#f1f5ff;border:1px solid #c8d6f5;border-radius:10px;padding:10px 14px;font-size:14px}
.ans.show{display:block}
.term{background:#0c0c0c;color:#ccc;font-family:var(--mono);font-size:13px;border-radius:6px;padding:8px 10px;height:300px;display:flex;flex-direction:column;cursor:text}
.term.lx{background:#300a24;color:#eee}
.tout{flex:1;overflow:auto;white-space:pre-wrap;word-break:break-all}
.tin{display:flex;white-space:pre}
.tin input{flex:1;background:transparent;border:0;outline:0;color:inherit;font:inherit;padding:0;min-width:40px}
.wall{display:inline-flex;flex-direction:column;align-items:center;gap:3px;border:2px solid transparent;border-radius:8px;padding:3px;background:none;font-size:12px}
.wall i{display:block;width:74px;height:46px;border-radius:5px}
.wall.on{border-color:#e95420}
.lst{background:#fff;border:1px solid #aaa;height:150px;overflow:auto;min-width:200px;flex:1}
.lst div{padding:2px 8px;cursor:pointer;white-space:nowrap}
.lst div.sel{background:#0078d7;color:#fff}
.dlg{background:#fff;border:1px solid #0078d7;padding:10px 12px;margin:10px 0;border-radius:4px;font-size:13.5px}
.kb{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #ddd;padding:6px 10px;margin:4px 0 4px 20px;border-radius:4px}
.kb span{flex:1}
.lang{font-weight:700;margin-top:8px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;background:#fff;border:1px solid #ccc;padding:8px;min-height:120px}
.files div{padding:6px;border-radius:3px;text-align:center;font-size:12.5px;cursor:default;word-break:break-all;user-select:none}
.files div .ic{font-size:26px;display:block}
.files div.sel{background:#cce8ff}
.ctx{position:absolute;background:#f2f2f2;border:1px solid #999;box-shadow:2px 2px 6px rgba(0,0,0,.25);font-size:13px;z-index:20;min-width:190px}
.ctx div{padding:5px 22px;cursor:pointer}
.ctx div:hover{background:#cce8ff}
.ctx .dis{color:#999}
.ctx hr{margin:2px 0;border:0;border-top:1px solid #ccc}
.preview{background:#fff;border:1px solid #ccc;min-height:90px;padding:10px;color:#000;font-family:'Times New Roman','PMingLiU',serif;font-size:16px}
textarea.code{width:100%;height:170px;font-family:var(--mono);font-size:13px;border:1px solid #aaa;padding:8px;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow:auto}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:20px 22px}
.modal h3{margin:0 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:12px 0}
.grid2 label{font-size:13px;color:var(--mut);display:flex;flex-direction:column}
.grid2 input,.grid2 select{padding:5px 8px;border:1px solid #bbb;border-radius:6px;color:var(--ink);font-size:14px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto;gap:4px}.nav li button{flex-direction:column;gap:2px;width:auto;min-width:70px}.nav .t{font-size:11.5px;text-align:center}.nav .os{display:none}.main{padding:16px 12px 50px}.grid2{grid-template-columns:1fr}.row label.w{width:auto}}
</style>
</head>
<body>
<div class="top">
  <h1>電腦硬體裝修丙級・監評人員現場指定內容表 練習平台<small>操作步驟＋模擬練習｜指定值可由老師自行修改</small></h1>
  <div class="station">工作崗位號碼 XX = <b id="xx">05</b>
    <button class="tbtn" id="newxx">🎲 換號碼</button></div>
  <button class="tbtn" id="editspec">⚙ 修改指定值</button>
  <button class="tbtn" id="resetall">↺ 清除進度</button>
</div>
<div class="wrap">
  <aside class="side">
    <div class="prog">已通過 <b id="pc">0</b> / 15 項<div class="bar"><i id="pb" style="width:0"></i></div></div>
    <ul class="nav" id="nav"></ul>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="modal" id="modal"><div class="box">
  <h3>修改監評指定值</h3>
  <div class="note">換一張指定內容表（B、C…）時，在這裡改數值即可；XX 會自動代入工作崗位號碼。設定只存在這台電腦的瀏覽器。</div>
  <div class="grid2" id="specform"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="cbtn ghost" id="specdef">還原為表 A</button>
    <button class="cbtn ghost" id="speccancel">取消</button>
    <button class="cbtn go" id="specsave">儲存</button>
  </div>
</div></div>

<script>
const DEF={sysGB:80,dataGB:30,vmRAM:2,winName:'cXX',linName:'vXX',winIP:'static',linIP:'dhcp',ipPrefix:'192.168.240.1',
backupMin:1,backupFile:'hosts',u1:'u01',p1:'p123456',u2:'u02',p2:'go8868@TW',printerMfr:'Generic',printerModel:'MS Publisher Color Printer',
saverMin:3,ime:'微軟倉頡',font:'漢鼎繁勘亭',office:['word'],ftpIP:'192.168.240.200',ftpPwd:'go8868@TW',
transfer:'C:\\windows\\win.ini',zip:'C:\\windows\\twain_32.dll',color:'red'};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign({},DEF,store.get('hw3_spec')||{});
let XX=store.get('hw3_xx')||rndXX();
let passed=store.get('hw3_passed')||{};
let cur=1,tab='steps',simCache={};
function rndXX(){return String(1+Math.floor(Math.random()*24)).padStart(2,'0')}
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sub=s=>String(s).replace(/XX/g,XX);
const ipv=()=>S.ipPrefix+XX;
const baseOf=p=>p.split('\\').pop();
const dirOf=p=>p.split('\\').slice(0,-1).join('\\');
const OFFICE={word:'文書軟體（Word）',excel:'電子試算表（Excel）',ppt:'簡報軟體（PowerPoint）'};
const COLOR={red:'紅',green:'綠',blue:'藍'};
const HOSTS='C:\\Windows\\System32\\drivers\\etc\\hosts';
const backupPath=()=>S.backupFile.toLowerCase()==='hosts'?HOSTS:S.backupFile;
let FTP,DESK;
function resetShared(){FTP={pwd:'passwd'+XX,changed:false,uploads:[]};DESK=[]}
resetShared();

const ITEMS=[
{id:1,t:'硬碟磁區規劃',os:'win',d:'規劃硬碟系統磁區及資料磁區，兩磁區容量總計不得低於 110GB，其中系統磁區容量不得低於 100GB，1 GBytes 可以換算為 1000 MBytes 或 1024 MBytes。',
 spec:()=>`系統磁區：${S.sysGB} GB　資料磁區：${S.dataGB} GB`},
{id:2,t:'虛擬機記憶體',os:'lx',d:'使用虛擬電腦軟體安裝 Linux 作業系統時所配置之主記憶體容量，其值不得高於實體機主記憶體容量。',
 spec:()=>`Linux 虛擬機記憶體：${S.vmRAM} GB（= ${S.vmRAM*1024} MB）`},
{id:3,t:'電腦名稱',os:'both',d:'設定電腦名稱，XX 表示應檢人工作崗位號碼。',
 spec:()=>`Windows：<code>${sub(S.winName)}</code>　Linux：<code>${sub(S.linName)}</code>`},
{id:4,t:'TCP/IP 設定',os:'both',d:'TCP/IP 設定。固定式之 TCP/IP 位址範圍為 192.168.240.1XX，XX 表示應檢人工作崗位號碼。',
 spec:()=>`Windows：${S.winIP==='static'?'固定式 <code>'+ipv()+'</code>':'動態式（DHCP）'}　Linux：${S.linIP==='static'?'固定式 <code>'+ipv()+'</code>':'動態式（DHCP）'}`},
{id:5,t:'自動排程備份',os:'win',d:'在兩種不同之作業系統之一，設定自動排程備份功能，指定檔案為 hosts。',
 spec:()=>`Windows：<b>${S.backupMin}</b> 分鐘後啟動，備份 <code>${esc(S.backupFile)}</code>`},
{id:6,t:'新增使用者',os:'lx',d:'在兩種不同之作業系統之一，新增兩個使用者及設定密碼，每一使用者有不同桌面或背景，密碼 6 個字元以上。',
 spec:()=>`Linux：<code>${esc(S.u1)}</code> / <code>${esc(S.p1)}</code>　<code>${esc(S.u2)}</code> / <code>${esc(S.p2)}</code>`},
{id:7,t:'印表機',os:'win',d:'在兩種不同之作業系統之一，設定印表機廠牌型號。',
 spec:()=>`Windows：${esc(S.printerMfr)} ${esc(S.printerModel)}`},
{id:8,t:'螢幕保護時間',os:'lx',d:'在兩種不同之作業系統之一，設定啟動螢幕保護模式時間。',
 spec:()=>`Linux：<b>${S.saverMin}</b> 分鐘`},
{id:9,t:'中文輸入法',os:'win',d:'在微軟作業系統中，設定中文輸入法種類，其餘須移除，但得保留「美式鍵盤」之設定。',
 spec:()=>`只留 <b>${esc(S.ime)}</b>（可保留美式鍵盤）`},
{id:10,t:'中文字型',os:'win',d:'在微軟作業系統中，設定中文字型名稱。',
 spec:()=>`安裝字型：<b>${esc(S.font)}</b>`},
{id:11,t:'Office 安裝',os:'win',d:'在微軟作業系統中，安裝 office 應用軟體，只能安裝勾選之軟體。',
 spec:()=>`只安裝：${S.office.map(o=>OFFICE[o]).join('、')||'（無）'}`},
{id:12,t:'FTP 改密碼',os:'win',d:'登入 FTP 主機更改個人 FTP 密碼，設定的密碼為 6 個字元以上，FTP 主機的 IP 為 192.168.240.200，登入帳號為 tXX，密碼初始值為 passwdXX，XX 表示工作崗位號碼，範圍 01~24。',
 spec:()=>`主機 <code>${S.ftpIP}</code>　帳號 <code>t${XX}</code>　舊密碼 <code>passwd${XX}</code> → 新密碼 <code>${esc(S.ftpPwd)}</code>`},
{id:13,t:'檔案傳輸',os:'win',d:'檔案傳輸之目錄或檔案名稱。',
 spec:()=>`上傳 <code>${esc(S.transfer)}</code> 到 FTP 主機`},
{id:14,t:'壓縮檔案',os:'win',d:'在微軟作業系統中，壓縮目錄或檔案之名稱。',
 spec:()=>`壓縮 <code>${esc(S.zip)}</code>`},
{id:15,t:'網頁字體顏色',os:'win',d:'網頁字體顏色。',
 spec:()=>`網頁文字顏色：<b style="color:${S.color}">${COLOR[S.color]}色</b>`}
];

const STEPS={
1:()=>{const a=S.sysGB*1024+1024,b=S.dataGB*1024;return `
<div class="sub">Windows 安裝時切割（建議做法）</div>
<ol class="steps">
<li>用 Windows 安裝媒體開機 → 選語言 →「立即安裝」→「我沒有產品金鑰」→ 選版本 → 接受授權。</li>
<li>選「<b>自訂：只安裝 Windows（進階）</b>」。</li>
<li>點「磁碟機 0 未配置的空間」→「<b>新增</b>」→ 大小輸入 <code>${a}</code> MB → 套用。<br><span class="note">${S.sysGB} GB × 1024 = ${S.sysGB*1024} MB；Windows 會從你輸入的數字中切出約 645 MB 給「修復／系統(EFI)／MSR」磁碟分割，所以多加 1024 MB，C: 才不會少於 ${S.sysGB} GB。</span></li>
<li>出現「Windows 可能會建立額外的磁碟分割」→「確定」。</li>
<li>點剩下的「未配置的空間」→「新增」→ 輸入 <code>${b}</code> MB（${S.dataGB} GB × 1024）→ 套用。</li>
<li>選取<b>第一個「主要」磁碟分割</b>（系統磁區）→「下一步」開始安裝。</li>
<li>安裝完成後 <span class="k">Win</span>+<span class="k">X</span> →「磁碟管理」：資料磁區若尚未格式化，右鍵「格式化」為 NTFS，並確認有磁碟機代號（如 D:）。</li>
</ol>
<div class="sub">也可以：安裝後再建立資料磁區</div>

function checkBar(box,fn,answer){
  const bar=document.createElement('div');bar.className='checkbar';
  bar.innerHTML=`<button class="cbtn go">✔ 檢查</button><button class="cbtn ghost">💡 參考答案</button><button class="cbtn ghost">↺ 重做</button>`;
  const res=document.createElement('div');res.className='result';
  const ans=document.createElement('div');ans.className='ans';
  box.append(bar,res,ans);
  bar.children[0].onclick=()=>{
    const r=fn();const ok=r.length&&r.every(x=>x[0]!==false);
    res.className='result '+(ok?'ok':'bad');
    res.innerHTML=`<b>${ok?'🎉 通過！符合監評指定內容':'還沒通過，請修正：'}</b><ul>${r.map(x=>`<li class="${x[0]===true?'y':x[0]===false?'n':'w'}">${x[0]===true?'✔':x[0]===false?'✘':'⚠'} ${x[1]}</li>`).join('')}</ul>`;
    if(ok){passed[cur]=true;store.set('hw3_passed',passed);renderNav();const p=$('#passtag');if(p)p.textContent='✔ 已通過'}
  };
  bar.children[1].onclick=()=>{ans.innerHTML=typeof answer==='function'?answer():answer;ans.classList.toggle('show')};
  bar.children[2].onclick=()=>{delete simCache[cur];renderPanel()};

function makeTerm(el,{prompt,onLine,banner,lx}){
  el.innerHTML=`<div class="term${lx?' lx':''}"><div class="tout"></div><div class="tin"><span class="tp"></span><input spellcheck="false" autocomplete="off" autocapitalize="off"></div></div>`;
  const out=$('.tout',el),inp=$('input',el),tp=$('.tp',el);let pending=null,hist=[],hi=0;
  const T={prompt,
    print(s){const d=document.createElement('div');d.textContent=s;out.appendChild(d);out.scrollTop=out.scrollHeight},
    setPrompt(p){T.prompt=p;if(!pending)tp.textContent=p},
    ask(q,masked,cb){pending={q,masked,cb};tp.textContent=q;inp.type=masked?'password':'text'},
    clear(){out.innerHTML=''}};
  tp.textContent=prompt;if(banner)T.print(banner);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const v=inp.value;inp.value='';
      if(pending){const p=pending;pending=null;inp.type='text';T.print(p.q+(p.masked?'':v));tp.textContent=T.prompt;p.cb(v)}
      else{T.print(T.prompt+v);if(v.trim())hist.push(v);hi=hist.length;onLine(v.trim(),T)}}
    else if(e.key==='ArrowUp'&&!pending){if(hi>0){hi--;inp.value=hist[hi]}e.preventDefault()}
    else if(e.key==='ArrowDown'&&!pending){if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=''}e.preventDefault()}
  });
  $('.term',el).addEventListener('click',()=>inp.focus());
  return T;
}

    $$('*',doc.body).forEach(el=>[...el.attributes].forEach(a=>{if(/^on/i.test(a.name))el.removeAttribute(a.name)}));
    let css='';$$('style',doc).forEach(s=>{css+=s.textContent.replace(/\b(body|html)\b/g,'.pvx')});
    pv.innerHTML=(css?`<style>${css.replace(/([^{}]+)\{/g,(m,s)=>s.split(',').map(x=>x.trim().startsWith('.pvx')?x:'.preview '+x.trim()).join(',')+'{')}</style>`:'')+`<div class="pvx" style="${esc(doc.body.getAttribute('style')||'')}">${doc.body.innerHTML}</div>`;
    const t=$('.pvx',pv),tx=doc.body.getAttribute('text');if(tx)t.style.color=tx};
  ta.oninput=render;render();
  checkBar(box,()=>{render();const r=[];const want={red:['rgb(255, 0, 0)'],green:['rgb(0, 128, 0)','rgb(0, 255, 0)'],blue:['rgb(0, 0, 255)']}[S.color];
    const walker=document.createTreeWalker($('.pvx',pv),NodeFilter.SHOW_TEXT);const cols=[];let n;
    while(n=walker.nextNode()){if(n.textContent.trim()&&n.parentElement.tagName!=='STYLE')cols.push(getComputedStyle(n.parentElement).color)}
    if(!cols.length)r.push([false,'網頁沒有任何文字']);
    else{const good=cols.filter(c=>want.includes(c)).length;r.push([good===cols.length,good===cols.length?`網頁文字皆為${COLOR[S.color]}色`:good?`只有部分文字是${COLOR[S.color]}色`:`文字不是${COLOR[S.color]}色`])}
    const fn=$('[data-fn]',box).value.trim(),ty=$('[data-ty]',box).value,en=$('[data-en]',box).value;
    const isH=/\.html?$/i.test(fn)&&!/\*/.test(fn);r.push([isH,isH?`檔名 ${esc(fn)}`:'檔名要以 .htm 或 .html 結尾（如 index.htm）']);
    r.push([ty==='all',ty==='all'?'存檔類型：所有檔案':'存檔類型要選「所有檔案 (*.*)」，否則會存成 '+esc(fn)+'.txt']);
    if(/[^\x00-\x7f]/.test(ta.value)&&en!=='UTF-8')r.push([false,'內容有中文，編碼請選 UTF-8 以免亂碼']);
    return r},()=>`把文字包在 <code>&lt;font color="${S.color}"&gt;…&lt;/font&gt;</code> 或 <code>&lt;p style="color:${S.color}"&gt;</code> 中；檔名 <code>index.htm</code>、類型「所有檔案」、編碼 UTF-8。`);
}};

function ftpSim(box,id){
  box.innerHTML=`<p class="simintro">模擬 Windows 命令提示字元的 ftp 用戶端，FTP 主機 <b>${S.ftpIP}</b>。第 12、13 項共用同一台伺服器：在 12 改過密碼後，13 要用新密碼登入。輸入時按 ↑ 可叫回上一個指令。</p>
  <div data-t></div><div class="note" style="margin-top:6px">伺服器密碼狀態：<b data-st></b>　｜　伺服器上的檔案：<b data-fs></b>　<button class="btn" data-rs>重設 FTP 伺服器</button></div>`;
  const st={mode:'cmd',conn:false,logged:false,cwd:'C:\\Users\\student',bin:false};
  const showSt=()=>{$('[data-st]',box).textContent=FTP.changed?'已變更':'初始 passwd'+XX;$('[data-fs]',box).textContent=FTP.uploads.map(u=>u.name).join('、')||'（無）'};
  $('[data-rs]',box).onclick=()=>{FTP={pwd:'passwd'+XX,changed:false,uploads:[]};showSt()};
  const winFiles=()=>{const s=new Set(['win.ini','system.ini','twain_32.dll','notepad.exe','regedit.exe']);[S.transfer,S.zip].forEach(p=>{if(dirOf(p).toLowerCase()==='c:\\windows')s.add(baseOf(p))});return[...s]};
  const LFS=()=>({'c:\\windows':winFiles(),'c:\\users\\student':['Desktop','Documents'],'c:\\users\\student\\desktop':DESK.map(d=>d.name),'c:\\':['Windows','Users','Program Files'],'d:\\':[]});
  const disp=p=>p.replace(/^([a-z]):/i,(m,d)=>d.toUpperCase()+':');
  const resolve=p=>{p=p.replace(/\//g,'\\').replace(/"/g,'');if(!/^[a-z]:/i.test(p))p=st.cwd.replace(/\\$/,'')+'\\'+p;p=p.replace(/\\+$/,'');if(/^[a-z]:$/i.test(p))p+='\\';return p};
  const prompt=()=>st.mode==='ftp'?'ftp> ':st.cwd+'>';
  function login(T){T.ask(`使用者 (${S.ftpIP}:(none)): `,false,u=>{T.print('331 User name okay, need password.');T.ask('密碼: ',true,p=>{
    if(u===('t'+XX)&&p===FTP.pwd){st.logged=true;T.print('230 User logged in, proceed.')}
    else{st.logged=false;T.print('530 Not logged in.\n登入失敗。'+(u!==('t'+XX)?'（帳號應為 t'+XX+'）':''))}})})}
  function connect(T,ip){if(ip!==S.ftpIP){T.print(`> ftp: connect :連線逾時（${ip||'未指定主機'}）`);return}
    T.print(`已連線到 ${ip}。\n220 Serv-U FTP Server v15.1 ready...\n200 OPTS UTF8 command successful - UTF8 encoding now ON.`);st.conn=true;login(T)}
  makeTerm($('[data-t]',box),{prompt:prompt(),banner:'Microsoft Windows [版本 10.0.19045]\n(c) Microsoft Corporation. 著作權所有，並保留一切權利。\n',onLine(l,T){
    const a=l.split(/\s+/),c=(a[0]||'').toLowerCase();
    if(st.mode==='cmd'){
      if(!l){}
      else if(c==='ftp'){st.mode='ftp';st.conn=false;st.logged=false;if(a[1])connect(T,a[1])}
      else if(c==='cd'){if(!a[1])T.print(st.cwd);else{const p=resolve(l.slice(3).trim());if(LFS()[p.toLowerCase()]!==undefined)st.cwd=disp(p);else T.print('系統找不到指定的路徑。')}}
      else if(c==='dir'){const f=LFS()[st.cwd.toLowerCase()]||[];T.print(` ${st.cwd} 的目錄\n\n`+f.map(x=>'               '+x).join('\n'))}
      else if(c==='cls')T.clear();
      else if(c==='ipconfig')T.print(`乙太網路卡 乙太網路:\n   IPv4 位址 . . . . . . . . . . . . : ${S.winIP==='static'?ipv():'192.168.240.'+(150+ +XX)}\n   子網路遮罩 . . . . . . . . . . . . : 255.255.255.0`);
      else if(c==='ping')T.print(a[1]===S.ftpIP?`Ping ${a[1]} (使用 32 位元組的資料):\n回覆自 ${a[1]}: 位元組=32 時間<1ms TTL=128\n回覆自 ${a[1]}: 位元組=32 時間<1ms TTL=128`:'要求等候逾時。');
      else T.print(`'${a[0]}' 不是內部或外部命令、可執行的程式或批次檔。`);
      T.setPrompt(prompt());return}
    const need=()=>{if(!st.conn){T.print('未連線。');return true}if(!st.logged){T.print('530 Please login with USER and PASS.');return true}return false};
    switch(c){
    case '':break;
    case 'open':if(st.conn)T.print('已連線到 '+S.ftpIP+'，請先使用 close。');else connect(T,a[1]);break;
    case 'user':if(!st.conn){T.print('未連線。');break}login(T);break;
    case 'quote':case 'literal':{if(need())break;const x=a.slice(1);
      if((x[0]||'').toLowerCase()==='site'&&(x[1]||'').toLowerCase()==='pswd'){
        if(!x[2]||!x[3]){T.print('501 Syntax error in parameters or arguments.');break}
        if(x[2]!==FTP.pwd){T.print('530 Password change failed: old password incorrect.');break}
        if(x[3].length<6){T.print('530 Password change failed: password does not meet requirements.');break}
        FTP.pwd=x[3];FTP.changed=true;T.print('230 Password changed okay.')}
      else if(!x.length)T.print('用法：quote 指令 參數');else T.print('500 Command not understood.');break}
    case 'lcd':{if(!a[1]){T.print('目前本機目錄 '+st.cwd+'。');break}const p=resolve(l.slice(4).trim());
      if(LFS()[p.toLowerCase()]!==undefined){st.cwd=disp(p);T.print('目前本機目錄 '+st.cwd+'。')}else T.print(a[1]+': 找不到檔案');break}
    case 'put':case 'send':{if(need())break;if(!a[1]){T.print('用法：put 本機檔案 [遠端檔案]');break}
      const p=resolve(a[1]);const d=dirOf(p).toLowerCase(),f=baseOf(p);const files=LFS()[d]||[];
      const real=files.find(x=>x.toLowerCase()===f.toLowerCase());
      if(!real){T.print(a[1]+': 找不到檔案');break}
      const remote=a[2]||(/[\\:]/.test(a[1])?a[1]:real);
      if(remote!==real)T.print('（注意：遠端檔名將為「'+remote+'」，部分伺服器會拒絕或保留路徑，建議先 lcd 再 put）');
      const nm=baseOf(remote.replace(/\//g,'\\'));
      FTP.uploads=FTP.uploads.filter(u=>u.name.toLowerCase()!==nm.toLowerCase());FTP.uploads.push({name:nm,from:disp(dirOf(p))});
      T.print(`200 PORT command successful.\n150 Opening ${st.bin?'BINARY':'ASCII'} mode data connection for ${nm}.\n226 Transfer complete.\nftp: 已傳送 ${200+nm.length*37} 位元組，時間 0.00秒`);break}
    case 'ls':case 'dir':if(need())break;T.print('200 PORT command successful.\n150 Opening ASCII mode data connection for /bin/ls.\n'+FTP.uploads.map(u=>u.name).join('\n')+'\n226 Transfer complete.');break;
    case 'binary':case 'bin':if(need())break;st.bin=true;T.print('200 Type set to I.');break;
    case 'ascii':if(need())break;st.bin=false;T.print('200 Type set to A.');break;
    case 'pwd':if(need())break;T.print('257 "/" is current directory.');break;
    case 'close':case 'disconnect':st.conn=false;st.logged=false;T.print('221 Goodbye!');break;
    case 'bye':case 'quit':if(st.conn)T.print('221 Goodbye!');st.mode='cmd';st.conn=false;st.logged=false;break;
    case 'help':case '?':T.print('可用：open user quote literal lcd put send ls dir binary ascii pwd close bye quit');break;
    default:T.print('無效的命令。')}
    T.setPrompt(prompt());showSt()}});
  showSt();
  if(id===12)checkBar(box,()=>[[FTP.changed&&FTP.pwd===S.ftpPwd,FTP.changed?(FTP.pwd===S.ftpPwd?`FTP 密碼已改為 ${esc(S.ftpPwd)}`:'密碼已變更，但與指定值不符'):'FTP 密碼尚未變更'],[S.ftpPwd.length>=6,'新密碼 6 個字元以上']],
    ()=>`<pre class="cmd">ftp ${S.ftpIP}
使用者: t${XX}
密碼: passwd${XX}
quote site pswd passwd${XX} ${esc(S.ftpPwd)}
bye</pre>`);
  else checkBar(box,()=>{const want=baseOf(S.transfer).toLowerCase(),wd=dirOf(S.transfer).toLowerCase();
    const u=FTP.uploads.find(x=>x.name.toLowerCase()===want);
    const r=[[!!u,u?`伺服器上已有 ${esc(u.name)}`:`伺服器上還沒有 ${esc(baseOf(S.transfer))}`]];
    if(u)r.push([u.from.toLowerCase()===wd,u.from.toLowerCase()===wd?'來源目錄正確 '+esc(dirOf(S.transfer)):'上傳的是 '+esc(u.from)+' 下的同名檔，應為 '+esc(dirOf(S.transfer))]);return r},
    ()=>`<pre class="cmd">ftp ${S.ftpIP}         ← 用${FTP.changed?'新':'目前的'}密碼登入
lcd ${esc(dirOf(S.transfer))}
binary
put ${esc(baseOf(S.transfer))}
ls
bye</pre>`);
}

function renderNav(){
  $('#xx').textContent=XX;
  $('#nav').innerHTML=ITEMS.map(it=>`<li><button class="${it.id===cur?'on':''} ${passed[it.id]?'done':''}" data-id="${it.id}"><span class="n">${passed[it.id]?'✓':it.id}</span><span class="t">${it.t}</span><span class="os">${it.os==='win'?'Win':it.os==='lx'?'Linux':'Win+Linux'}</span></button></li>`).join('');
  $$('#nav button').forEach(b=>b.onclick=()=>{cur=+b.dataset.id;renderNav();renderMain();window.scrollTo(0,0)});
  const n=Object.keys(passed).filter(k=>passed[k]).length;$('#pc').textContent=n;$('#pb').style.width=(n/15*100)+'%';
}
function renderMain(){
  const it=ITEMS.find(x=>x.id===cur);
  const tags=it.os==='win'?'<span class="tag">微軟作業系統</span>':it.os==='lx'?'<span class="tag lx">Linux/UNIX</span>':'<span class="tag">微軟作業系統</span><span class="tag lx">Linux/UNIX</span>';
  $('#main').innerHTML=`<div class="head"><div class="big">${it.id}</div><div><h2>${it.t} ${tags}</h2></div><span class="passed" id="passtag">${passed[it.id]?'✔ 已通過':''}</span></div>
  <div class="req"><div class="lbl">題目說明</div><p>${it.d}</p><div class="lbl">本卷指定值（工作崗位 ${XX}）</div><div class="specv">${it.spec()}</div></div>
  <div class="tabs"><button data-t="steps" class="${tab==='steps'?'on':''}">📘 操作步驟</button><button data-t="sim" class="${tab==='sim'?'on':''}">🖱 模擬練習</button></div>
  <div class="panel" id="panel"></div>
  <div class="row" style="justify-content:space-between;margin-top:14px">${cur>1?`<button class="cbtn ghost" data-go="${cur-1}">← 第 ${cur-1} 項</button>`:'<span></span>'}${cur<15?`<button class="cbtn ghost" data-go="${cur+1}">第 ${cur+1} 項 →</button>`:''}</div>`;
  $$('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));renderPanel()});
  $$('[data-go]').forEach(b=>b.onclick=()=>{cur=+b.dataset.go;renderNav();renderMain();window.scrollTo(0,0)});
  renderPanel();
}
function renderPanel(){
  const p=$('#panel');p.innerHTML='';
  if(tab==='steps'){p.innerHTML=STEPS[cur]();return}
  if(!simCache[cur]){const box=document.createElement('div');SIM[cur](box);simCache[cur]=box}
  p.appendChild(simCache[cur]);
}
$('#newxx').onclick=()=>{XX=rndXX();store.set('hw3_xx',XX);simCache={};resetShared();renderNav();renderMain()};
$('#resetall').onclick=()=>{passed={};store.set('hw3_passed',passed);simCache={};resetShared();renderNav();renderMain()};

const FIELDS=[['sysGB','1. 系統磁區 (GB)','number'],['dataGB','1. 資料磁區 (GB)','number'],['vmRAM','2. VM 記憶體 (GB)','number'],['winName','3. Windows 電腦名稱','text'],['linName','3. Linux 電腦名稱','text'],
['winIP','4. Windows IP',['static','dhcp']],['linIP','4. Linux IP',['static','dhcp']],['ipPrefix','4. 固定 IP 前綴（後接 XX）','text'],['backupMin','5. 幾分鐘後啟動','number'],['backupFile','5. 備份檔案（hosts 或完整路徑）','text'],
['u1','6. 使用者一帳號','text'],['p1','6. 使用者一密碼','text'],['u2','6. 使用者二帳號','text'],['p2','6. 使用者二密碼','text'],['printerMfr','7. 印表機製造商','text'],['printerModel','7. 印表機型號','text'],
['saverMin','8. 螢幕保護（分）','number'],['ime','9. 中文輸入法',['微軟注音','微軟倉頡','微軟速成']],['font','10. 中文字型','text'],['office','11. Office 軟體','office'],['ftpIP','12. FTP 主機 IP','text'],['ftpPwd','12. 新 FTP 密碼','text'],
['transfer','13. 傳輸檔案（完整路徑）','text'],['zip','14. 壓縮檔案（完整路徑）','text'],['color','15. 網頁字體顏色',['red','green','blue']]];
function openSpec(src){$('#specform').innerHTML=FIELDS.map(([k,l,t])=>{
  if(t==='office')return `<label>${l}<span style="display:flex;gap:10px;padding:5px 0;color:var(--ink)">${Object.keys(OFFICE).map(o=>`<span><input type="checkbox" data-o="${o}"${src.office.includes(o)?' checked':''}> ${OFFICE[o].replace(/（.*/,'')}</span>`).join('')}</span></label>`;
  if(Array.isArray(t))return `<label>${l}<select data-k="${k}">${t.map(o=>`<option value="${o}"${src[k]===o?' selected':''}>${{static:'固定式',dhcp:'動態式',red:'紅',green:'綠',blue:'藍'}[o]||o}</option>`).join('')}</select></label>`;
  return `<label>${l}<input type="${t}" data-k="${k}" value="${esc(src[k])}"></label>`}).join('');$('#modal').classList.add('show')}
$('#editspec').onclick=()=>openSpec(S);
$('#specdef').onclick=()=>openSpec(DEF);
$('#speccancel').onclick=()=>$('#modal').classList.remove('show');
$('#specsave').onclick=()=>{const n=Object.assign({},S);$$('#specform [data-k]').forEach(i=>{const t=FIELDS.find(f=>f[0]===i.dataset.k)[2];n[i.dataset.k]=t==='number'?(+i.value||0):i.value.trim()});
  n.office=$$('#specform [data-o]').filter(c=>c.checked).map(c=>c.dataset.o);S=n;store.set('hw3_spec',S);simCache={};resetShared();$('#modal').classList.remove('show');renderNav();renderMain()};
